<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Our moving sale has ended. Everything is gone. Thank you!">
  <title>Moving Sale — Sold Out</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #f7f4ed; color: #25231f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { width: 100%; max-width: 640px; }
    .eyebrow { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #8c6d4b; margin-bottom: 24px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(3.4rem, 11vw, 6.2rem); line-height: 1.06; letter-spacing: -0.05em; margin: 0 0 26px; }
    p { margin: 0; font-size: clamp(1.15rem, 3.5vw, 1.55rem); line-height: 1.5; color: #625e56; }
    .rule { width: 66px; height: 2px; margin: 36px auto 0; background: #c3a47b; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Moving Sale · Sold Out</div>
    <h1>Everything is gone.</h1>
    <p>Thank you!</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
